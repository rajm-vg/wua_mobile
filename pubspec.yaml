name: wua_mobile
description: "Water User Association - Irrigation Management Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^7.3.2

  # Local Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3

  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Routing
  go_router: ^18.1.1

  # Functional Error Handling
  dartz: ^0.10.1

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

  # Logging
  logger: ^2.5.0

  # Environment
  flutter_dotenv: ^6.0.1

  # Intl & Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  freezed: ^4.0.1
  injectable_generator: ^3.1.3

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - .env.dev
    - .env.qa
    - .env.uat
    - .env.prod
